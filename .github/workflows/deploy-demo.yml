name: Deploy demo to GitHub Pages

# Assumes this workflow lives at the root of the repo that CONTAINS
# frontend/ directly (i.e. cue-platform is the repo root). If cue-platform
# is nested inside a larger repo, adjust the `working-directory` /
# `path` values below to point at cue-platform/frontend.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Repo Pages URL is https://<owner>.github.io/<repo>/ for a project
      # page, so assets must be built with that sub-path as the base.
      - name: Build demo (static, no backend)
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
